<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Location - GeoCRUD</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        /* Override style.css background for dashboard pages */
        body {
            background: #f0f2f5 !important;
            display: block !important;
            align-items: unset !important;
            justify-content: unset !important;
            padding: 0 !important;
        }

        /* Match backend create.blade.php styles exactly */
        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 32px;
            flex-wrap: wrap;
        }

        .form-actions .btn {
            flex: 1;
            min-width: 140px;
        }

        .btn-primary {
            background: #0d6efd !important;
            color: white !important;
        }

        .btn-secondary {
            background: #6c757d !important;
            color: white !important;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .btn-secondary:hover {
            background: #5a6268 !important;
        }

        @media screen and (max-width: 768px) {
            .form-actions {
                flex-direction: column !important;
                margin-top: 24px !important;
                gap: 10px !important;
            }

            .form-actions .btn {
                width: 100% !important;
                min-width: unset !important;
                flex: none !important;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="top-nav">
        <div class="nav-container">
            <a href="dashboard.html" class="logo">📍 GeoCRUD</a>
            <div class="nav-links">
                <a href="dashboard.html" class="nav-link">← Back</a>
                <span class="user-info">
                    <button onclick="logout()" class="btn-logout">Logout</button>
                </span>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <div>
                <h1>Add New GIS Location</h1>
                <p class="subtitle" style="text-align: center; color: #6b7280; margin: 0.5rem 0 0 0;">Fill out the form below to add a new geographic location.</p>
            </div>
        </div>

        <div id="messages"></div>

        <div class="card">
            <form id="create-form">
                <!-- Image field FIRST (matches backend) -->
                <div class="form-group">
                    <label for="image">Location Image (Optional):</label>
                    <input type="file" id="image" name="image" accept="image/*">
                </div>

                <div class="form-group">
                    <label for="location">Location Name:</label>
                    <input type="text" id="location" name="location" required 
                           placeholder="e.g., MU, City Hall, etc.">
                </div>

                <div class="form-group">
                    <label for="latitude">Latitude:</label>
                    <input type="number" id="latitude" name="latitude" step="0.00000001" required
                           placeholder="e.g., 8.14954800">
                    <small>Enter a decimal number between -90 and 90</small>
                </div>

                <div class="form-group">
                    <label for="longitude">Longitude:</label>
                    <input type="number" id="longitude" name="longitude" step="0.00000001" required
                           placeholder="e.g., 123.84147700">
                    <small>Enter a decimal number between -180 and 180</small>
                </div>

                <div class="form-group">
                    <label for="category">Category (Optional):</label>
                    <input type="text" id="category" name="category" 
                           placeholder="e.g., University, Restaurant, Park">
                </div>

                <div class="form-group">
                    <label for="notes">Notes (Optional):</label>
                    <textarea id="notes" name="notes" rows="4" 
                              placeholder="Additional information about this location"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Add Location</button>
                    <a href="dashboard.html" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        // Check authentication
        if (!isAuthenticated()) {
            window.location.href = 'login.html';
        }

        document.getElementById('create-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('location', document.getElementById('location').value);
            formData.append('latitude', document.getElementById('latitude').value);
            formData.append('longitude', document.getElementById('longitude').value);
            
            const category = document.getElementById('category').value;
            if (category) formData.append('category', category);
            
            const notes = document.getElementById('notes').value;
            if (notes) formData.append('notes', notes);
            
            const image = document.getElementById('image').files[0];
            if (image) formData.append('image', image);
            
            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Adding...';
            
            try {
                const token = getAuthToken();
                const response = await fetch(API_ENDPOINTS.GIS_CREATE, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json',
                    },
                    body: formData
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.message || 'Failed to create location');
                }
                
                showMessage('Location created successfully!', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
                
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Add Location';
            }
        });

        function showMessage(message, type) {
            const messagesDiv = document.getElementById('messages');
            const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
            messagesDiv.innerHTML = `<div class="alert ${alertClass}">${message}</div>`;
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                removeAuthToken();
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
