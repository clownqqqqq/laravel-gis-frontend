<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login Flow - GeoCRUD</title>
    <script src="js/config.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .step {
            background: white;
            padding: 20px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #007acc;
        }
        .step.success { border-left-color: #10b981; }
        .step.error { border-left-color: #ef4444; }
        .step.pending { border-left-color: #f59e0b; }
        button {
            background: #007acc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #005a9e; }
        pre {
            background: #f3f4f6;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>🔍 Login Flow Test</h1>
    <p>This page will test the complete login flow and identify where it fails.</p>
    
    <button onclick="testFullFlow()">🚀 Test Complete Flow</button>
    <button onclick="clearResults()">Clear Results</button>
    
    <div id="results"></div>

    <script>
        function addStep(message, status = 'pending') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `step ${status}`;
            div.innerHTML = `<pre>${new Date().toLocaleTimeString()} - ${message}</pre>`;
            results.appendChild(div);
            div.scrollIntoView({ behavior: 'smooth' });
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        async function testFullFlow() {
            clearResults();
            addStep('Starting login flow test...', 'pending');
            
            // Step 1: Clear old data
            addStep('Step 1: Clearing old authentication data...', 'pending');
            localStorage.removeItem('auth_token');
            localStorage.removeItem('user_data');
            addStep('✓ Old data cleared', 'success');
            
            // Step 2: Test login API
            addStep('Step 2: Testing login API (you need to enter credentials)...', 'pending');
            const username = prompt('Enter username for testing:');
            const password = prompt('Enter password for testing:');
            
            if (!username || !password) {
                addStep('✗ Test cancelled - no credentials provided', 'error');
                return;
            }
            
            try {
                const loginResponse = await fetch(API_ENDPOINTS.LOGIN, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });
                
                const loginData = await loginResponse.json();
                addStep(`Login API Response Status: ${loginResponse.status}`, loginResponse.ok ? 'success' : 'error');
                addStep(`Login API Response: ${JSON.stringify(loginData, null, 2)}`, loginResponse.ok ? 'success' : 'error');
                
                if (!loginResponse.ok || !loginData.success) {
                    addStep('✗ Login failed - stopping test', 'error');
                    return;
                }
                
                // Step 3: Save token
                addStep('Step 3: Saving authentication token...', 'pending');
                if (loginData.auth_token) {
                    setAuthToken(loginData.auth_token);
                    const savedToken = getAuthToken();
                    
                    if (savedToken === loginData.auth_token) {
                        addStep(`✓ Token saved successfully (length: ${savedToken.length})`, 'success');
                        addStep(`Token preview: ${savedToken.substring(0, 30)}...`, 'success');
                    } else {
                        addStep('✗ Token save failed - tokens do not match!', 'error');
                        return;
                    }
                } else {
                    addStep('✗ No auth_token in response!', 'error');
                    return;
                }
                
                // Step 4: Save user data
                if (loginData.user) {
                    setUserData(loginData.user);
                    addStep(`✓ User data saved: ${loginData.user.username || loginData.user.email}`, 'success');
                }
                
                // Step 5: Wait a moment
                addStep('Step 4: Waiting 1 second to simulate redirect delay...', 'pending');
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                // Step 6: Verify token still exists
                addStep('Step 5: Verifying token still exists...', 'pending');
                const verifyToken = getAuthToken();
                if (verifyToken) {
                    addStep(`✓ Token still exists after delay (length: ${verifyToken.length})`, 'success');
                } else {
                    addStep('✗ Token lost after delay!', 'error');
                    return;
                }
                
                // Step 7: Test API call with token
                addStep('Step 6: Testing API call to fetch locations...', 'pending');
                try {
                    const apiResponse = await fetch(API_ENDPOINTS.GIS_INDEX, {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${verifyToken}`,
                            'Accept': 'application/json',
                        },
                    });
                    
                    const apiData = await apiResponse.json();
                    addStep(`API Response Status: ${apiResponse.status}`, apiResponse.ok ? 'success' : 'error');
                    
                    if (apiResponse.status === 401) {
                        addStep('✗ API rejected token with 401 Unauthorized', 'error');
                        addStep(`Error message: ${apiData.message || apiData.error || 'Unknown error'}`, 'error');
                        addStep(`Token sent: ${verifyToken.substring(0, 30)}...`, 'error');
                        addStep(`Full response: ${JSON.stringify(apiData, null, 2)}`, 'error');
                    } else if (apiResponse.ok) {
                        const locations = apiData.data || apiData.locations || [];
                        addStep(`✓ API call successful! Found ${locations.length} locations`, 'success');
                    } else {
                        addStep(`✗ API returned error: ${apiResponse.status}`, 'error');
                        addStep(`Response: ${JSON.stringify(apiData, null, 2)}`, 'error');
                    }
                } catch (apiError) {
                    addStep(`✗ API call failed: ${apiError.message}`, 'error');
                }
                
                // Step 8: Final verification
                addStep('Step 7: Final token verification...', 'pending');
                const finalToken = getAuthToken();
                if (finalToken) {
                    addStep(`✓ Token still exists (length: ${finalToken.length})`, 'success');
                } else {
                    addStep('✗ Token lost during API call!', 'error');
                }
                
                addStep('✅ Test complete!', 'success');
                
            } catch (error) {
                addStep(`✗ Test failed with error: ${error.message}`, 'error');
                addStep(`Stack: ${error.stack}`, 'error');
            }
        }
    </script>
</body>
</html>
