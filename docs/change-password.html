<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - GeoCRUD</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>">
    <link rel="stylesheet" href="css/backend-styles.css">
    <script src="js/config.js"></script>
    <style>
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .form-actions .btn {
            flex: 1;
            max-width: 200px;
        }

        @media screen and (max-width: 768px) {
            .form-actions {
                flex-direction: column;
            }

            .form-actions .btn {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <nav class="top-nav">
            <div class="container">
                <a href="dashboard.html" class="logo">
                    <span>📍</span> GIS Manager
                </a>
                <div class="nav-buttons">
                    <a href="profile.html" class="nav-btn">
                        <span>👤</span> Profile
                    </a>
                    <button onclick="logout()" class="nav-btn">
                        <span>🚪</span> Logout
                    </button>
                </div>
            </div>
        </nav>
        <div class="content-area">
            <div class="container">
                <h1 style="color: #0d6efd; display: flex; align-items: center; gap: 10px; margin-bottom: 30px;">
                    <span style="font-size: 36px;">🔒</span> Change Password
                </h1>

                <div id="messages"></div>

                <div class="card">
                    <form id="change-password-form" onsubmit="changePassword(event); return false;">
                        <div class="form-group">
                            <label for="current_password">Current Password</label>
                            <input type="password" id="current_password" name="current_password" required>
                        </div>

                        <div class="form-group">
                            <label for="password">New Password</label>
                            <input type="password" id="password" name="password" required minlength="6">
                            <small style="display: block; margin-top: 5px; color: #6c757d; font-size: 13px;">Must be at least 6 characters</small>
                        </div>

                        <div class="form-group">
                            <label for="password_confirmation">Confirm New Password</label>
                            <input type="password" id="password_confirmation" name="password_confirmation" required minlength="6">
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Change Password</button>
                            <a href="profile.html" class="btn" style="background: #6c757d; color: white; text-decoration: none; display: flex; align-items: center; justify-content: center;">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function getUserData() {
            try {
                const userData = localStorage.getItem('user_data');
                return userData ? JSON.parse(userData) : null;
            } catch (e) {
                return null;
            }
        }

        function getAuthToken() {
            return localStorage.getItem('auth_token');
        }

        function showMessage(message, type) {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => {
                messagesDiv.innerHTML = '';
            }, 5000);
        }

        async function changePassword(e) {
            e.preventDefault();
            const userData = getUserData();
            const userId = userData?.id;

            if (!userId) {
                showMessage('User ID not found.', 'error');
                return;
            }

            const password = document.getElementById('password').value;
            const passwordConfirmation = document.getElementById('password_confirmation').value;
            const currentPassword = document.getElementById('current_password').value;

            if (password !== passwordConfirmation) {
                showMessage('New passwords do not match!', 'error');
                return;
            }

            const submitBtn = document.querySelector('#change-password-form button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Changing...';

            try {
                const data = await apiRequest(`${API_BASE_URL}/profile/${userId}/change-password`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        current_password: currentPassword,
                        password: password,
                        password_confirmation: passwordConfirmation
                    })
                });

                if (data.success) {
                    showMessage('Password changed successfully!', 'success');
                    setTimeout(() => {
                        window.location.href = 'profile.html';
                    }, 2000);
                } else {
                    throw new Error(data.message || 'Failed to change password.');
                }
            } catch (error) {
                showMessage('Error changing password: ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Change Password';
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        // Check authentication on page load
        document.addEventListener('DOMContentLoaded', function() {
            const userData = getUserData();
            if (!userData || !getAuthToken()) {
                showMessage('Please login to change your password.', 'error');
                setTimeout(() => window.location.href = 'login.html', 2000);
            }
        });
    </script>
</body>
</html>
