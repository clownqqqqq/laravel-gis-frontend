<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Debug Test</title>
    <script src="js/config.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background: #0b5ed7;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Login Debug Test</h1>
    
    <div class="test-section">
        <h2>1. Check Current Token</h2>
        <button onclick="checkToken()">Check Token in localStorage</button>
        <pre id="token-result"></pre>
    </div>
    
    <div class="test-section">
        <h2>2. Test Login</h2>
        <input type="text" id="username" placeholder="Username" value="kiya">
        <input type="password" id="password" placeholder="Password">
        <button onclick="testLogin()">Test Login</button>
        <pre id="login-result"></pre>
    </div>
    
    <div class="test-section">
        <h2>3. Test API Call with Token</h2>
        <button onclick="testApiCall()">Test /api/gis</button>
        <pre id="api-result"></pre>
    </div>
    
    <div class="test-section">
        <h2>4. Clear Everything</h2>
        <button onclick="clearAll()">Clear localStorage and Reload</button>
    </div>

    <script>
        function checkToken() {
            const token = localStorage.getItem('auth_token');
            const userData = localStorage.getItem('user_data');
            const result = {
                tokenExists: !!token,
                tokenLength: token ? token.length : 0,
                tokenPreview: token ? token.substring(0, 40) + '...' : 'NO TOKEN',
                tokenFull: token,
                userData: userData ? JSON.parse(userData) : null
            };
            document.getElementById('token-result').textContent = JSON.stringify(result, null, 2);
        }
        
        async function testLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultEl = document.getElementById('login-result');
            
            resultEl.textContent = 'Logging in...';
            resultEl.className = '';
            
            try {
                const response = await fetch('https://geocrud.bytevortexz.com/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });
                
                const data = await response.json();
                
                if (response.ok && data.success && data.auth_token) {
                    const token = data.auth_token.trim();
                    localStorage.setItem('auth_token', token);
                    if (data.user) {
                        localStorage.setItem('user_data', JSON.stringify(data.user));
                    }
                    
                    resultEl.className = 'success';
                    resultEl.textContent = JSON.stringify({
                        success: true,
                        message: 'Login successful!',
                        tokenLength: token.length,
                        tokenPreview: token.substring(0, 40) + '...',
                        tokenFull: token,
                        user: data.user
                    }, null, 2);
                } else {
                    resultEl.className = 'error';
                    resultEl.textContent = JSON.stringify({
                        success: false,
                        error: data.error || data.message,
                        fullResponse: data
                    }, null, 2);
                }
            } catch (error) {
                resultEl.className = 'error';
                resultEl.textContent = 'Error: ' + error.message;
            }
        }
        
        async function testApiCall() {
            const resultEl = document.getElementById('api-result');
            const token = localStorage.getItem('auth_token');
            
            if (!token) {
                resultEl.className = 'error';
                resultEl.textContent = 'No token found! Please login first.';
                return;
            }
            
            resultEl.textContent = 'Testing API call...';
            resultEl.className = '';
            
            try {
                const response = await fetch('https://geocrud.bytevortexz.com/api/gis', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token.trim()}`,
                        'Accept': 'application/json',
                    },
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultEl.className = 'success';
                    resultEl.textContent = JSON.stringify({
                        success: true,
                        status: response.status,
                        locationsCount: data.data ? data.data.length : 0,
                        preview: data
                    }, null, 2);
                } else {
                    resultEl.className = 'error';
                    resultEl.textContent = JSON.stringify({
                        success: false,
                        status: response.status,
                        error: data.error || data.message,
                        fullResponse: data,
                        tokenUsed: {
                            length: token.length,
                            preview: token.substring(0, 40) + '...'
                        }
                    }, null, 2);
                }
            } catch (error) {
                resultEl.className = 'error';
                resultEl.textContent = 'Error: ' + error.message;
            }
        }
        
        function clearAll() {
            localStorage.clear();
            alert('localStorage cleared! Reloading...');
            window.location.reload();
        }
        
        // Auto-check token on load
        checkToken();
    </script>
</body>
</html>
