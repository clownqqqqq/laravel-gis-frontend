<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, shrink-to-fit=no">
    <title>Edit Location - GeoCRUD</title>
    <link rel="stylesheet" href="css/backend-styles.css">
    <style>
        /* Page-specific styles from edit.blade.php */
        .current-image-wrapper {
            margin-bottom: 16px;
        }

        .current-image {
            width: 200px;
            height: 200px;
            max-width: 100%;
            border-radius: 12px;
            object-fit: cover;
            display: block;
            border: 3px solid #0d6efd;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .no-image-text {
            color: #64748b;
            margin: 12px 0;
            font-size: 15px;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 32px;
            flex-wrap: wrap;
        }

        .form-actions .btn {
            flex: 1;
            min-width: 140px;
        }

        .btn-primary {
            background: #0d6efd !important;
        }

        .btn-secondary {
            background: #6c757d !important;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .btn-secondary:hover {
            background: #5a6268 !important;
        }

        .delete-section {
            margin-top: 32px;
            padding-top: 32px;
            border-top: 2px solid #e5e7eb;
        }

        .btn-danger {
            background: #dc3545 !important;
            width: 100%;
            max-width: 300px;
        }

        .btn-danger:hover {
            background: #bb2d3b !important;
        }

        @media screen and (max-width: 768px) {
            .current-image {
                width: 100% !important;
                height: auto;
                max-height: 250px;
            }

            .form-actions {
                flex-direction: column !important;
                margin-top: 24px !important;
                gap: 10px !important;
            }

            .form-actions .btn {
                width: 100% !important;
                min-width: unset !important;
                flex: none !important;
            }

            .delete-section {
                margin-top: 24px !important;
                padding-top: 24px !important;
            }

            .btn-danger {
                max-width: 100% !important;
                width: 100% !important;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <nav class="top-nav">
            <div class="container">
                <a href="dashboard.html" class="logo">
                    <span>📍</span> GIS Manager
                </a>
                <div class="nav-buttons">
                    <a href="dashboard.html" class="nav-btn">
                        <span>←</span> Back
                    </a>
                    <button onclick="logout()" class="nav-btn">
                        <span>🚪</span> Logout
                    </button>
                </div>
            </div>
        </nav>
        <div class="content-area">
            <div class="container">
                <h1>Edit GIS Location</h1>
                <p class="subtitle" style="text-align: center;">Update the location details below.</p>

                <div id="messages"></div>
                <div id="loading" class="alert alert-info" style="display: none;">Loading location...</div>

                <div class="card" id="form-card" style="display: none;">
                    <form id="edit-form">
                        <div class="form-group">
                            <label for="image">Current Image:</label>
                            <div id="current-image-wrapper" style="display: none;">
                                <div class="current-image-wrapper">
                                    <img id="current-image" src="" alt="Current Image" class="current-image">
                                </div>
                            </div>
                            <p id="no-image-text" class="no-image-text" style="display: none;">No image uploaded</p>
                            <input type="file" id="image" name="image" accept="image/*">
                            <small>Upload a new image to change.</small>
                        </div>

                        <div class="form-group">
                            <label for="location">Location Name:</label>
                            <input type="text" id="location" name="location" required>
                        </div>

                        <div class="form-group">
                            <label for="latitude">Latitude:</label>
                            <input type="number" id="latitude" name="latitude" step="0.00000001" required>
                            <small>Enter a decimal number between -90 and 90</small>
                        </div>

                        <div class="form-group">
                            <label for="longitude">Longitude:</label>
                            <input type="number" id="longitude" name="longitude" step="0.00000001" required>
                            <small>Enter a decimal number between -180 and 180</small>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                            <a href="dashboard.html" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>

                    <div class="delete-section">
                        <button type="button" onclick="deleteLocation()" class="btn btn-danger">Delete Location</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        // Wait for DOM to be fully loaded
        // Store locationId globally so it's accessible in form submission
        let locationId = null;

        document.addEventListener('DOMContentLoaded', function() {
            // Check authentication
            if (!isAuthenticated()) {
                window.location.href = 'login.html';
                return;
            }

            // Get location ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            locationId = urlParams.get('id');

            console.log('🔍 Page loaded, location ID from URL:', locationId);

            if (!locationId) {
                showMessage('No location ID provided', 'error');
            } else {
                // Small delay to ensure all elements are ready
                setTimeout(() => {
                    loadLocation(locationId);
                }, 100);
            }

            // Attach form submission handler
            const editForm = document.getElementById('edit-form');
            if (editForm) {
                editForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    if (!locationId) {
                        showMessage('Error: Location ID not found. Please refresh the page.', 'error');
                        return;
                    }
                    
                    const formData = new FormData();
                    formData.append('location', document.getElementById('location').value);
                    formData.append('latitude', document.getElementById('latitude').value);
                    formData.append('longitude', document.getElementById('longitude').value);
                    formData.append('_method', 'PUT');
                    
                    const image = document.getElementById('image').files[0];
                    if (image) formData.append('image', image);
                    
                    const submitBtn = this.querySelector('button[type="submit"]');
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Saving...';
                    
                    try {
                        const data = await apiRequest(API_ENDPOINTS.GIS_UPDATE(locationId), {
                            method: 'POST',
                            body: formData
                        });
                        
                        // API returns the updated location object
                        if (data && (data.id || data.location)) {
                            showMessage('Location updated successfully!', 'success');
                            setTimeout(() => {
                                window.location.href = 'dashboard.html';
                            }, 1500);
                        } else if (data && data.success === false) {
                            throw new Error(data.message || data.error || 'Failed to update location');
                        } else {
                            throw new Error('Unexpected response from server');
                        }
                        
                    } catch (error) {
                        console.error('Error updating location:', error);
                        const errorMessage = error.message || 'Failed to update location. Please check your connection and try again.';
                        showMessage('Error: ' + errorMessage, 'error');
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Save Changes';
                    }
                });
            }
        });

        async function loadLocation(id) {
            const loadingEl = document.getElementById('loading');
            const formCardEl = document.getElementById('form-card');
            
            if (loadingEl) loadingEl.style.display = 'block';
            if (formCardEl) formCardEl.style.display = 'none';
            
            try {
                console.log('🔍 Loading location with ID:', id);
                
                // Check if form fields exist
                const locationInput = document.getElementById('location');
                const latitudeInput = document.getElementById('latitude');
                const longitudeInput = document.getElementById('longitude');
                
                if (!locationInput || !latitudeInput || !longitudeInput) {
                    throw new Error('Form fields not found. Please refresh the page.');
                }
                
                const data = await apiRequest(API_ENDPOINTS.GIS_SHOW(id));
                console.log('✅ Location data received:', data);
                console.log('📦 Full API response structure:', JSON.stringify(data, null, 2));
                
                // API returns the location object directly (not wrapped in data.location)
                // But check if it's wrapped in a 'data' property or 'location' property
                let location = data;
                if (data && data.data) {
                    location = data.data;
                    console.log('📦 Data was wrapped in "data" property');
                } else if (data && data.location) {
                    location = data.location;
                    console.log('📦 Data was wrapped in "location" property');
                }
                
                if (!location) {
                    throw new Error('No location data received from server');
                }
                
                // Check if we have at least location name or ID
                if (!location.id && !location.location) {
                    console.error('❌ Invalid location data:', location);
                    throw new Error('Invalid location data received from server');
                }
                
                // Populate form fields - ensure values are set
                const locationName = String(location.location || '').trim();
                const latitude = String(location.latitude || '').trim();
                const longitude = String(location.longitude || '').trim();
                
                console.log('📝 Setting form values:', { 
                    locationName, 
                    latitude, 
                    longitude,
                    hasImage: !!location.image
                });
                
                // Set form field values
                locationInput.value = locationName;
                latitudeInput.value = latitude;
                longitudeInput.value = longitude;
                
                // Verify values were set
                console.log('✅ Form values after setting:', {
                    location: locationInput.value,
                    latitude: latitudeInput.value,
                    longitude: longitudeInput.value
                });
                
                // Handle image display (matches backend structure)
                const currentImageWrapper = document.getElementById('current-image-wrapper');
                const currentImage = document.getElementById('current-image');
                const noImageText = document.getElementById('no-image-text');
                
                if (location.image) {
                    const imageUrl = `https://geocrud.bytevortexz.com/uploads/${location.image}`;
                    console.log('🖼️ Loading image:', imageUrl);
                    
                    if (currentImage) {
                        currentImage.src = imageUrl;
                        currentImage.onerror = function() {
                            console.error('❌ Image failed to load:', imageUrl);
                            if (currentImageWrapper) currentImageWrapper.style.display = 'none';
                            if (noImageText) noImageText.style.display = 'block';
                        };
                        currentImage.onload = function() {
                            console.log('✅ Image loaded successfully');
                        };
                    }
                    
                    if (currentImageWrapper) currentImageWrapper.style.display = 'block';
                    if (noImageText) noImageText.style.display = 'none';
                } else {
                    console.log('ℹ️ No image for this location');
                    if (currentImageWrapper) currentImageWrapper.style.display = 'none';
                    if (noImageText) noImageText.style.display = 'block';
                }
                
                // Show form and hide loading
                if (loadingEl) loadingEl.style.display = 'none';
                if (formCardEl) formCardEl.style.display = 'block';
                
                console.log('✅ Location loaded successfully');
                
            } catch (error) {
                console.error('❌ Error loading location:', error);
                if (loadingEl) loadingEl.style.display = 'none';
                const errorMsg = error.message || 'Unknown error. Please check console for details.';
                showMessage('Error loading location: ' + errorMsg, 'error');
            }
        }

        // Attach form submission handler after DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            const editForm = document.getElementById('edit-form');
            if (editForm) {
                editForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    if (!locationId) {
                        showMessage('Error: Location ID not found. Please refresh the page.', 'error');
                        return;
                    }
                    
                    const formData = new FormData();
                    formData.append('location', document.getElementById('location').value);
                    formData.append('latitude', document.getElementById('latitude').value);
                    formData.append('longitude', document.getElementById('longitude').value);
                    formData.append('_method', 'PUT');
                    
                    const image = document.getElementById('image').files[0];
                    if (image) formData.append('image', image);
                    
                    const submitBtn = this.querySelector('button[type="submit"]');
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Saving...';
                    
                    try {
                        const data = await apiRequest(API_ENDPOINTS.GIS_UPDATE(locationId), {
                            method: 'POST',
                            body: formData
                        });
                        
                        // API returns the updated location object
                        if (data && (data.id || data.location)) {
                            showMessage('Location updated successfully!', 'success');
                            setTimeout(() => {
                                window.location.href = 'dashboard.html';
                            }, 1500);
                        } else if (data && data.success === false) {
                            throw new Error(data.message || data.error || 'Failed to update location');
                        } else {
                            throw new Error('Unexpected response from server');
                        }
                        
                    } catch (error) {
                        console.error('Error updating location:', error);
                        const errorMessage = error.message || 'Failed to update location. Please check your connection and try again.';
                        showMessage('Error: ' + errorMessage, 'error');
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Save Changes';
                    }
                });
            }
        });

        async function deleteLocation() {
            if (!confirm('Are you sure you want to delete this location? This action cannot be undone.')) {
                return;
            }

            try {
                await apiRequest(API_ENDPOINTS.GIS_DELETE(locationId), {
                    method: 'DELETE'
                });
                
                showMessage('Location deleted successfully!', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
                
            } catch (error) {
                showMessage('Error deleting location: ' + error.message, 'error');
            }
        }

        function showMessage(message, type) {
            const messagesDiv = document.getElementById('messages');
            const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
            messagesDiv.innerHTML = `<div class="alert ${alertClass}">${message}</div>`;
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                removeAuthToken();
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
