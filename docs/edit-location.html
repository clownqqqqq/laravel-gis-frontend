<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Location - GeoCRUD</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        /* Override style.css background for dashboard pages */
        body {
            background: #f0f2f5 !important;
            display: block !important;
            align-items: unset !important;
            justify-content: unset !important;
            padding: 0 !important;
        }

        /* Override form-actions button width - more specific to override style.css */
        .card .form-actions .btn,
        .card .form-actions button,
        .card .form-actions a.btn {
            width: auto !important;
            min-width: 120px;
            max-width: none !important;
            display: inline-block !important;
        }

        /* Ensure all buttons are clickable */
        .btn, button, a.btn {
            cursor: pointer !important;
            pointer-events: auto !important;
            z-index: 1;
            position: relative;
        }

        /* Override style.css button styles completely */
        .card .btn,
        .card button.btn {
            width: auto !important;
        }

        /* Make delete button visible and styled */
        .card .btn-delete,
        .card button.btn-delete {
            width: auto !important;
            background: #ef4444 !important;
            color: white !important;
            border: none !important;
            padding: 0.75rem 1.5rem !important;
        }

        .card .btn-delete:hover {
            background: #dc2626 !important;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="top-nav">
        <div class="nav-container">
            <a href="dashboard.html" class="logo">📍 GeoCRUD</a>
            <div class="nav-links">
                <a href="dashboard.html" class="nav-link">← Back</a>
                <span class="user-info">
                    <button onclick="logout()" class="btn-logout">Logout</button>
                </span>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <div>
                <h1>✏️ Edit Location</h1>
                <p style="color: #6b7280; margin: 0.5rem 0 0 0; font-size: 0.95rem;">Update the location details below.</p>
            </div>
        </div>

        <div id="messages"></div>
        <div id="loading" class="loading" style="display: none;">Loading location...</div>

        <div class="card" id="form-card" style="display: none;">
            <form id="edit-form">
                <!-- Current Image Section (shown first) -->
                <div class="form-group" id="image-preview-group" style="display: none;">
                    <label>Current Image:</label>
                    <div id="current-image" style="margin-top: 0.5rem;"></div>
                    <small style="display: block; margin-top: 0.5rem; color: #6b7280;">Upload a new image to change.</small>
                </div>

                <div class="form-group">
                    <label for="location">Location Name *</label>
                    <input type="text" id="location" name="location" required>
                </div>

                <div class="form-group">
                    <label for="latitude">Latitude *</label>
                    <input type="number" id="latitude" name="latitude" step="0.00000001" required>
                    <small>Enter a decimal number between -90 and 90</small>
                </div>

                <div class="form-group">
                    <label for="longitude">Longitude *</label>
                    <input type="number" id="longitude" name="longitude" step="0.00000001" required>
                    <small>Enter a decimal number between -180 and 180</small>
                </div>

                <div class="form-group">
                    <label for="category">Category (Optional)</label>
                    <input type="text" id="category" name="category">
                </div>

                <div class="form-group">
                    <label for="notes">Notes (Optional)</label>
                    <textarea id="notes" name="notes" rows="4"></textarea>
                </div>

                <div class="form-group">
                    <label for="image">Location Image (Optional)</label>
                    <input type="file" id="image" name="image" accept="image/*">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="dashboard.html" class="btn btn-secondary">Cancel</a>
                </div>

                <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #e5e7eb;">
                    <button type="button" onclick="deleteLocation()" class="btn btn-delete" style="background: #ef4444; color: white;">
                        🗑️ Delete Location
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        // Check authentication
        if (!isAuthenticated()) {
            window.location.href = 'login.html';
        }

        // Get location ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const locationId = urlParams.get('id');

        if (!locationId) {
            showMessage('No location ID provided', 'error');
        } else {
            loadLocation(locationId);
        }

        async function loadLocation(id) {
            document.getElementById('loading').style.display = 'block';
            
            try {
                const data = await apiRequest(API_ENDPOINTS.GIS_SHOW(id));
                const location = data.location || data;
                
                document.getElementById('location').value = location.location || '';
                document.getElementById('latitude').value = location.latitude || '';
                document.getElementById('longitude').value = location.longitude || '';
                document.getElementById('category').value = location.category || '';
                document.getElementById('notes').value = location.notes || '';
                
                if (location.image) {
                    const imageUrl = `https://geocrud.bytevortexz.com/uploads/${location.image}`;
                    const imagePreviewGroup = document.getElementById('image-preview-group');
                    document.getElementById('current-image').innerHTML = `
                        <img src="${imageUrl}" style="max-width: 300px; max-height: 200px; border-radius: 0.5rem; border: 1px solid #d1d5db; object-fit: cover;" 
                             onerror="this.style.display='none'">
                    `;
                    imagePreviewGroup.style.display = 'block';
                }
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('form-card').style.display = 'block';
                
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                showMessage('Error loading location: ' + error.message, 'error');
            }
        }

        document.getElementById('edit-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('location', document.getElementById('location').value);
            formData.append('latitude', document.getElementById('latitude').value);
            formData.append('longitude', document.getElementById('longitude').value);
            formData.append('_method', 'PUT');
            
            const category = document.getElementById('category').value;
            if (category) formData.append('category', category);
            
            const notes = document.getElementById('notes').value;
            if (notes) formData.append('notes', notes);
            
            const image = document.getElementById('image').files[0];
            if (image) formData.append('image', image);
            
            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Saving...';
            
            try {
                const token = getAuthToken();
                const response = await fetch(API_ENDPOINTS.GIS_UPDATE(locationId), {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json',
                    },
                    body: formData
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.message || 'Failed to update location');
                }
                
                showMessage('Location updated successfully!', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
                
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Save Changes';
            }
        });

        async function deleteLocation() {
            if (!confirm('Are you sure you want to delete this location? This action cannot be undone.')) {
                return;
            }

            try {
                await apiRequest(API_ENDPOINTS.GIS_DELETE(locationId), {
                    method: 'DELETE'
                });
                
                showMessage('Location deleted successfully!', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
                
            } catch (error) {
                showMessage('Error deleting location: ' + error.message, 'error');
            }
        }

        function showMessage(message, type) {
            const messagesDiv = document.getElementById('messages');
            const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
            messagesDiv.innerHTML = `<div class="alert ${alertClass}">${message}</div>`;
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                removeAuthToken();
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
