<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Location - GeoCRUD</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        /* Override style.css background for dashboard pages */
        body {
            background: #f0f2f5 !important;
            display: block !important;
            align-items: unset !important;
            justify-content: unset !important;
            padding: 0 !important;
        }

        /* Match backend edit page styles exactly */
        .current-image-wrapper {
            margin-bottom: 16px;
        }

        .current-image {
            width: 200px;
            height: 200px;
            max-width: 100%;
            border-radius: 12px;
            object-fit: cover;
            display: block;
            border: 3px solid #0d6efd;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .no-image-text {
            color: #64748b;
            margin: 12px 0;
            font-size: 15px;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 32px;
            flex-wrap: wrap;
        }

        .form-actions .btn {
            flex: 1;
            min-width: 140px;
        }

        .btn-primary {
            background: #0d6efd !important;
            color: white !important;
        }

        .btn-secondary {
            background: #6c757d !important;
            color: white !important;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .btn-secondary:hover {
            background: #5a6268 !important;
        }

        .delete-section {
            margin-top: 32px;
            padding-top: 32px;
            border-top: 2px solid #e5e7eb;
        }

        .btn-danger {
            background: #dc3545 !important;
            color: white !important;
            width: 100%;
            max-width: 300px;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-danger:hover {
            background: #bb2d3b !important;
        }

        @media screen and (max-width: 768px) {
            .current-image {
                width: 100% !important;
                height: auto;
                max-height: 250px;
            }

            .form-actions {
                flex-direction: column !important;
                margin-top: 24px !important;
                gap: 10px !important;
            }

            .form-actions .btn {
                width: 100% !important;
                min-width: unset !important;
                flex: none !important;
            }

            .delete-section {
                margin-top: 24px !important;
                padding-top: 24px !important;
            }

            .btn-danger {
                max-width: 100% !important;
                width: 100% !important;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="top-nav">
        <div class="nav-container">
            <a href="dashboard.html" class="logo">📍 GeoCRUD</a>
            <div class="nav-links">
                <a href="dashboard.html" class="nav-link">← Back</a>
                <span class="user-info">
                    <button onclick="logout()" class="btn-logout">Logout</button>
                </span>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <div>
                <h1>Edit GIS Location</h1>
                <p class="subtitle" style="text-align: center; color: #6b7280; margin: 0.5rem 0 0 0;">Update the location details below.</p>
            </div>
        </div>

        <div id="messages"></div>
        <div id="loading" class="loading" style="display: none;">Loading location...</div>

        <div class="card" id="form-card" style="display: none;">
            <form id="edit-form">
                <!-- Current Image FIRST (matches backend) -->
                <div class="form-group">
                    <label for="image">Current Image:</label>
                    <div id="current-image-wrapper" style="display: none;">
                        <div class="current-image-wrapper">
                            <img id="current-image" src="" alt="Current Image" class="current-image">
                        </div>
                    </div>
                    <p id="no-image-text" class="no-image-text" style="display: none;">No image uploaded</p>
                    <input type="file" id="image" name="image" accept="image/*">
                    <small>Upload a new image to change.</small>
                </div>

                <div class="form-group">
                    <label for="location">Location Name:</label>
                    <input type="text" id="location" name="location" required>
                </div>

                <div class="form-group">
                    <label for="latitude">Latitude:</label>
                    <input type="number" id="latitude" name="latitude" step="0.00000001" required>
                    <small>Enter a decimal number between -90 and 90</small>
                </div>

                <div class="form-group">
                    <label for="longitude">Longitude:</label>
                    <input type="number" id="longitude" name="longitude" step="0.00000001" required>
                    <small>Enter a decimal number between -180 and 180</small>
                </div>

                <div class="form-group">
                    <label for="category">Category (Optional):</label>
                    <input type="text" id="category" name="category">
                </div>

                <div class="form-group">
                    <label for="notes">Notes (Optional):</label>
                    <textarea id="notes" name="notes" rows="4"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="dashboard.html" class="btn btn-secondary">Cancel</a>
                </div>
            </form>

            <div class="delete-section">
                <button type="button" onclick="deleteLocation()" class="btn btn-danger">Delete Location</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        // Check authentication
        if (!isAuthenticated()) {
            window.location.href = 'login.html';
        }

        // Get location ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const locationId = urlParams.get('id');

        if (!locationId) {
            showMessage('No location ID provided', 'error');
        } else {
            loadLocation(locationId);
        }

        async function loadLocation(id) {
            document.getElementById('loading').style.display = 'block';
            
            try {
                const data = await apiRequest(API_ENDPOINTS.GIS_SHOW(id));
                const location = data.location || data;
                
                document.getElementById('location').value = location.location || '';
                document.getElementById('latitude').value = location.latitude || '';
                document.getElementById('longitude').value = location.longitude || '';
                document.getElementById('category').value = location.category || '';
                document.getElementById('notes').value = location.notes || '';
                
                // Handle image display (matches backend structure)
                const currentImageWrapper = document.getElementById('current-image-wrapper');
                const currentImage = document.getElementById('current-image');
                const noImageText = document.getElementById('no-image-text');
                
                if (location.image) {
                    const imageUrl = `https://geocrud.bytevortexz.com/uploads/${location.image}`;
                    currentImage.src = imageUrl;
                    currentImageWrapper.style.display = 'block';
                    noImageText.style.display = 'none';
                } else {
                    currentImageWrapper.style.display = 'none';
                    noImageText.style.display = 'block';
                }
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('form-card').style.display = 'block';
                
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                showMessage('Error loading location: ' + error.message, 'error');
            }
        }

        document.getElementById('edit-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('location', document.getElementById('location').value);
            formData.append('latitude', document.getElementById('latitude').value);
            formData.append('longitude', document.getElementById('longitude').value);
            formData.append('_method', 'PUT');
            
            const category = document.getElementById('category').value;
            if (category) formData.append('category', category);
            
            const notes = document.getElementById('notes').value;
            if (notes) formData.append('notes', notes);
            
            const image = document.getElementById('image').files[0];
            if (image) formData.append('image', image);
            
            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Saving...';
            
            try {
                const token = getAuthToken();
                const response = await fetch(API_ENDPOINTS.GIS_UPDATE(locationId), {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json',
                    },
                    body: formData
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.message || 'Failed to update location');
                }
                
                showMessage('Location updated successfully!', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
                
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Save Changes';
            }
        });

        async function deleteLocation() {
            if (!confirm('Are you sure you want to delete this location? This action cannot be undone.')) {
                return;
            }

            try {
                await apiRequest(API_ENDPOINTS.GIS_DELETE(locationId), {
                    method: 'DELETE'
                });
                
                showMessage('Location deleted successfully!', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
                
            } catch (error) {
                showMessage('Error deleting location: ' + error.message, 'error');
            }
        }

        function showMessage(message, type) {
            const messagesDiv = document.getElementById('messages');
            const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
            messagesDiv.innerHTML = `<div class="alert ${alertClass}">${message}</div>`;
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                removeAuthToken();
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
